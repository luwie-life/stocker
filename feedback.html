<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Help & feedback — stocker</title><link rel="stylesheet" href="css/stocker.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><div class="topbar"><div><div class="topbar-business" id="topbar-business">—</div><div class="topbar-meta" id="topbar-user">—</div></div><div class="topbar-actions"><button class="btn btn-secondary" id="logout-btn">Sign out</button></div></div><h1 class="page-heading">Help & feedback</h1><p class="page-intro">Tell us what is happening. You can follow replies here.</p><div class="admin-grid"><section class="card"><div class="section-header"><div><h2 class="card-title">Send a message</h2><p class="card-subtitle">Problems, ideas, and questions are welcome.</p></div></div><form id="feedback-form"><div class="field"><label for="feedback-type">Type</label><select id="feedback-type"><option value="PROBLEM">Report a problem</option><option value="FEATURE">Suggest a feature</option><option value="HELP">Ask for help</option><option value="GENERAL">General feedback</option></select></div><div class="field"><label for="feedback-subject">Subject</label><input id="feedback-subject" required maxlength="160"></div><div class="field"><label for="feedback-message">Message</label><textarea id="feedback-message" rows="6" required maxlength="5000"></textarea></div><button class="btn btn-primary" id="feedback-submit">Send feedback</button></form></section><section class="card"><div class="section-header"><div><h2 class="card-title">Your messages</h2><p class="card-subtitle">Replies from the stocker team appear here.</p></div><button class="btn btn-secondary" id="refresh-feedback" type="button">Refresh</button></div><div id="feedback-list"><div class="empty-state">Loading…</div></div></section></div></main></div><script type="module" src="js/feedback/feedback.js"></script></body></html>
