<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory — stocker</title>
<link rel="stylesheet" href="css/stocker.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-business" id="topbar-business">—</div>
        <div class="topbar-meta" id="topbar-user">—</div>
      </div>
      <div class="topbar-actions"><button class="btn btn-secondary" id="logout-btn">Sign out</button></div>
    </div>

    <h1 class="page-heading">Inventory</h1>
    <p class="page-intro">Keep products, pricing, and stock levels in one reliable ledger.</p>

    <div class="card">
      <div class="section-header">
        <div><h2 class="card-title">Products</h2><p class="card-subtitle">Search and update the catalogue for this branch.</p></div>
        <div style="display:flex;gap:8px">
          <input id="search-input" placeholder="Search name, SKU or barcode…" aria-label="Search products" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--paper);font-size:0.85rem;width:220px"/>
          <button class="btn btn-primary" id="new-product-btn">+ Add product</button>
        </div>
      </div>
      <div id="product-list"></div>
    </div>
  </main>
</div>

<!-- New / edit product modal -->
<div id="product-modal" style="display:none;position:fixed;inset:0;background:rgba(25,23,22,0.4);align-items:center;justify-content:center;z-index:500">
  <div class="card" style="width:420px;max-width:92vw">
    <h3 style="margin-top:0" id="modal-title">Add product</h3>
    <form id="product-form">
      <input type="hidden" id="product-id"/>
      <div class="field"><label>Name</label><input id="p-name" required/></div>
      <div class="field"><label>SKU (optional)</label><input id="p-sku"/></div>
      <div class="field"><label>Barcode (optional)</label><input id="p-barcode"/></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label id="cost-label">Cost price</label><input id="p-cost" type="number" step="0.01" min="0" required/></div>
        <div class="field"><label id="price-label">Selling price</label><input id="p-price" type="number" step="0.01" min="0" required/></div>
      </div>
      <div class="field"><label>Minimum stock alert</label><input id="p-minstock" type="number" min="0" value="0"/></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-save">Save product</button>
      </div>
    </form>
  </div>
</div>

<!-- Stock adjust modal -->
<div id="stock-modal" style="display:none;position:fixed;inset:0;background:rgba(25,23,22,0.4);align-items:center;justify-content:center;z-index:500">
  <div class="card" style="width:360px;max-width:92vw">
    <h3 style="margin-top:0">Adjust stock</h3>
    <form id="stock-form">
      <input type="hidden" id="s-product-id"/>
      <div class="field">
        <label>Movement type</label>
        <select id="s-type">
          <option value="OPENING_STOCK">Opening stock</option>
          <option value="PURCHASE">Purchase received</option>
          <option value="MANUAL_ADD">Manual add</option>
          <option value="MANUAL_REMOVE">Manual remove</option>
          <option value="DAMAGE">Damage / write-off</option>
          <option value="ADJUSTMENT">Adjustment</option>
        </select>
      </div>
      <div class="field"><label>Quantity (use negative to remove)</label><input id="s-quantity" type="number" required/></div>
      <div class="field"><label>Reason (optional)</label><input id="s-reason"/></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn btn-secondary" id="stock-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Apply</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/inventory/inventory.js"></script>
</body>
</html>
