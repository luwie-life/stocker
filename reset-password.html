<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password — stocker</title><link rel="stylesheet" href="css/stocker.css"></head>
<body><main class="centered-shell"><section class="card auth-card"><a class="wordmark" href="home.html">stocker</a><h1 class="page-heading">Choose a new password</h1><p class="page-intro">Use at least 8 characters. This link can only be used once.</p><form id="reset-form"><div class="field"><label>New password</label><input id="reset-password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="reset-confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary btn-block" type="submit">Update password</button></form><p id="reset-status" class="auth-status"></p><a class="auth-help-link" href="login.html">Back to sign in</a></section></main><script type="module" src="js/auth/reset-password.js"></script></body></html>
