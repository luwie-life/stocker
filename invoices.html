<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoices — stocker</title><link rel="stylesheet" href="css/stocker.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><div class="topbar"><div><div class="topbar-business" id="topbar-business">—</div><div class="topbar-meta" id="topbar-user">—</div></div><div class="topbar-actions"><button class="btn btn-secondary" id="logout-btn">Sign out</button></div></div><h1 class="page-heading">Invoices</h1><p class="page-intro">Create a clean record for customers who need to pay later.</p><div class="admin-grid"><section class="card"><div class="section-header"><div><h2 class="card-title">New invoice</h2><p class="card-subtitle">Draft it now, issue it when ready.</p></div></div><form id="invoice-form"><div class="field"><label for="invoice-branch">Branch</label><select id="invoice-branch" required></select></div><div class="field"><label for="invoice-description">Line description</label><input id="invoice-description" required></div><div class="form-row"><div class="field"><label for="invoice-quantity">Quantity</label><input id="invoice-quantity" type="number" min="1" value="1" required></div><div class="field"><label for="invoice-price">Unit price</label><input id="invoice-price" type="number" min="0" step="0.01" required></div></div><div class="field"><label for="invoice-notes">Notes</label><textarea id="invoice-notes" rows="3"></textarea></div><button class="btn btn-primary" id="invoice-submit">Create invoice</button></form></section><section class="card"><div class="section-header"><div><h2 class="card-title">Recent invoices</h2><p class="card-subtitle">Print-ready records for your business.</p></div><button class="btn btn-secondary" id="refresh-invoices" type="button">Refresh</button></div><div id="invoice-list"><div class="empty-state">Loading…</div></div></section></div></main></div><script type="module" src="js/invoices/invoices.js"></script></body></html>
