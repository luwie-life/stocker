<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff — stocker</title><link rel="stylesheet" href="css/stocker.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><div class="topbar"><div><div class="topbar-business" id="topbar-business">—</div><div class="topbar-meta" id="topbar-user">—</div></div><div class="topbar-actions"><button class="btn btn-secondary" id="logout-btn">Sign out</button></div></div><h1 class="page-heading">Staff</h1><p class="page-intro">Give your team the right access for the work they handle.</p><div class="admin-grid"><section class="card"><div class="section-header"><div><h2 class="card-title">Add staff member</h2><p class="card-subtitle">They can sign in immediately with these details.</p></div></div><form id="staff-form"><div class="field"><label for="staff-name">Full name</label><input id="staff-name" required></div><div class="field"><label for="staff-email">Email</label><input id="staff-email" type="email" required></div><div class="field"><label for="staff-password">Temporary password</label><input id="staff-password" type="password" minlength="8" required></div><div class="form-row"><div class="field"><label for="staff-role">Role</label><select id="staff-role"><option>CASHIER</option><option>SALES_STAFF</option><option>STOREKEEPER</option><option>ACCOUNTANT</option><option>MANAGER</option><option>ADMIN</option></select></div><div class="field"><label for="staff-branch">Branch</label><select id="staff-branch" required></select></div></div><button class="btn btn-primary" id="staff-submit">Add staff member</button></form></section><section class="card"><div class="section-header"><div><h2 class="card-title">Team</h2><p class="card-subtitle">Active membership and branch assignments.</p></div><button class="btn btn-secondary" id="refresh-staff" type="button">Refresh</button></div><div id="staff-list"><div class="empty-state">Loading…</div></div></section></div></main></div><script type="module" src="js/staff/staff.js"></script></body></html>
